name: Scarica esercizi Hevy

# Manuale: salva in tools/hevy_esercizi.json l'elenco degli esercizi di Hevy. Non pubblica l'app.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Scarica
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: python3 tools/hevy_esercizi.py
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898693+github-actions[bot]@users.noreply.github.com"
          git add tools/hevy_esercizi.json
          git commit -m "Esercizi Hevy scaricati [skip ci]" || true
          git push
