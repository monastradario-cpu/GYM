name: Genera figure esercizi

# Manuale: disegna con VideoDB le figure di tutti gli esercizi e le salva nel repo.
# Riprende da dove si era fermato. Non pubblica l'app.
on:
  # ogni notte alle 2:07 ora italiana (due orari UTC per coprire ora legale e solare: parte solo quello delle 2)
  schedule:
    - cron: "7 0 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      quanti:
        description: "Quanti esercizi fare (0 = tutti quelli mancanti)"
        default: "0"
      solo:
        description: "Solo questi esercizi (id separati da virgola, vuoto = tutti)"
        default: ""
      rifai:
        description: "Rifai anche le figure già presenti (1 = sì)"
        default: "0"
      solo_testi:
        description: "Solo i testi di esecuzione, niente immagini (1 = sì)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: genera-figure
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa VideoDB
        run: pip install "videodb>=0.5.0" pillow

      - name: Solo alle 2 ora italiana
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Europe/Rome date +%H)" != "02" ]; then echo "Non sono le 2 in Italia: salto"; echo "SALTA=1" >> $GITHUB_ENV; fi

      - name: Genera
        if: env.SALTA != '1'
        env:
          VIDEO_DB_API_KEY: ${{ secrets.VIDEO_DB_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          QUANTI: ${{ inputs.quanti }}
          SOLO: ${{ inputs.solo }}
          RIFAI: ${{ inputs.rifai }}
          SOLO_TESTI: ${{ inputs.solo_testi }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898693+github-actions[bot]@users.noreply.github.com"
          python tools/genera_tutte.py

      - name: Esito
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esito-figure
          path: risultati_figure.json
          if-no-files-found: ignore
