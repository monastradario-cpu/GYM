name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Controllo Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Controllo sintassi JavaScript
        run: for f in app/src/main/assets/www/js/*.js; do node --check "$f"; done

      - name: Compila APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk GYM-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GYM-1.0.${{ github.run_number }}
          path: GYM-1.0.${{ github.run_number }}.apk

      - name: Pubblica Release (usata dall'aggiornamento in-app)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GYM 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: GYM-1.0.${{ github.run_number }}.apk
          make_latest: true
